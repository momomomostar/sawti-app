          cat > app/src/main/java/com/example/camipro/CameraStore.kt << 'RWF_EOF'
          package com.example.camipro

          import android.content.Context
          import org.json.JSONArray
          import org.json.JSONObject
          import java.util.UUID

          class CameraStore(context: Context) {

              data class Cam(
                  val id: String, val name: String, val host: String,
                  val port: Int, val path: String, val user: String, val pass: String
              ) {
                  fun rtspUrl(): String {
                      val auth = if (user.isNotBlank()) "$user:$pass@" else ""
                      return "rtsp://$auth$host:$port$path"
                  }
              }

              private val prefs = context.getSharedPreferences("cams", Context.MODE_PRIVATE)

              fun all(): MutableList<Cam> {
                  val list = mutableListOf<Cam>()
                  val arr = JSONArray(prefs.getString("list", "[]") ?: "[]")
                  for (i in 0 until arr.length()) {
                      val o = arr.getJSONObject(i)
                      list.add(Cam(
                          o.getString("id"), o.getString("name"), o.getString("host"),
                          o.getInt("port"), o.getString("path"), o.getString("user"), o.getString("pass")
                      ))
                  }
                  return list
              }

              fun upsert(cam: Cam) {
                  val list = all()
                  val idx = list.indexOfFirst { it.id == cam.id }
                  if (idx >= 0) list[idx] = cam else list.add(cam)
                  save(list)
              }

              fun remove(id: String) = save(all().filterNot { it.id == id })

              private fun save(list: List<Cam>) {
                  val arr = JSONArray()
                  list.forEach { c ->
                      arr.put(JSONObject().put("id", c.id).put("name", c.name).put("host", c.host)
                          .put("port", c.port).put("path", c.path).put("user", c.user).put("pass", c.pass))
                  }
                  prefs.edit().putString("list", arr.toString()).apply()
              }

              companion object { fun newId() = UUID.randomUUID().toString() }
          }
          RWF_EOF
          cat > app/src/main/java/com/example/camipro/MainActivity.kt << 'RWF_EOF'
          package com.example.camipro

          import android.content.Intent
          import android.os.Bundle
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.Toast
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.recyclerview.widget.LinearLayoutManager
          import com.example.camipro.databinding.ActivityMainBinding

          class MainActivity : AppCompatActivity() {
              private lateinit var binding: ActivityMainBinding
              private lateinit var store: CameraStore
              private lateinit var adapter: CameraAdapter

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  binding = ActivityMainBinding.inflate(layoutInflater)
                  setContentView(binding.root)
                  title = "كاميراتي"
                  store = CameraStore(this)
                  adapter = CameraAdapter(
                      onClick = { cam ->
                          startActivity(Intent(this, LiveActivity::class.java)
                              .putExtra("url", cam.rtspUrl()).putExtra("name", cam.name))
                      },
                      onLongClick = { cam ->
                          AlertDialog.Builder(this)
                              .setTitle(cam.name)
                              .setItems(arrayOf("تعديل", "مسح")) { _, which ->
                                  if (which == 0) showCameraDialog(cam)
                                  else { store.remove(cam.id); refresh() }
                              }
                              .show()
                          true
                      }
                  )
                  binding.recycler.layoutManager = LinearLayoutManager(this)
                  binding.recycler.adapter = adapter
                  binding.fabAdd.setOnClickListener { showCameraDialog(null) }
                  binding.btnRecordings.setOnClickListener {
                      startActivity(Intent(this, RecordingsActivity::class.java))
                  }
              }

              override fun onResume() { super.onResume(); refresh() }

              private fun refresh() = adapter.submit(store.all())

              private fun showCameraDialog(existing: CameraStore.Cam?) {
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(48, 24, 48, 8)
                  }
                  val etName = EditText(this).apply { hint = "اسم الكاميرا (مثال: الكور)" }
                  val etHost = EditText(this).apply { hint = "عنوان IP (مثال: 192.168.1.20)" }
                  val etPort = EditText(this).apply { hint = "المنفذ (554)"; setText("554") }
                  val etPath = EditText(this).apply { hint = "المسار (مثال: /live/ch00_0)"; setText("/live/ch00_0") }
                  val etUser = EditText(this).apply { hint = "المستخدم (إلا كان)" }
                  val etPass = EditText(this).apply { hint = "كلمة السر (إلا كانت)" }
                  existing?.let {
                      etName.setText(it.name); etHost.setText(it.host)
                      etPort.setText(it.port.toString()); etPath.setText(it.path)
                      etUser.setText(it.user); etPass.setText(it.pass)
                  }
                  listOf(etName, etHost, etPort, etPath, etUser, etPass).forEach { layout.addView(it) }

                  AlertDialog.Builder(this)
                      .setTitle(if (existing == null) "زيد كاميرا" else "بدّل الكاميرا")
                      .setView(layout)
                      .setPositiveButton("سجّل") { _, _ ->
                          val host = etHost.text.toString().trim()
                          if (host.isEmpty()) {
                              Toast.makeText(this, "العنوان خاوي", Toast.LENGTH_SHORT).show()
                              return@setPositiveButton
                          }
                          val path = etPath.text.toString().ifBlank { "/live/ch00_0" }
                              .let { if (it.startsWith("/")) it else "/$it" }
                          store.upsert(CameraStore.Cam(
                              existing?.id ?: CameraStore.newId(),
                              etName.text.toString().ifBlank { host },
                              host,
                              etPort.text.toString().toIntOrNull() ?: 554,
                              path,
                              etUser.text.toString().trim(),
                              etPass.text.toString()
                          ))
                          refresh()
                      }
                      .setNegativeButton("لا", null)
                      .show()
              }
          }
          RWF_EOF
          cat > app/src/main/java/com/example/camipro/CameraAdapter.kt << 'RWF_EOF'
          package com.example.camipro

          import android.view.LayoutInflater
          import android.view.ViewGroup
          import androidx.recyclerview.widget.RecyclerView
          import com.example.camipro.databinding.ItemCameraBinding

          class CameraAdapter(
              private val onClick: (CameraStore.Cam) -> Unit,
              private val onLongClick: (CameraStore.Cam) -> Unit
          ) : RecyclerView.Adapter<CameraAdapter.VH>() {

              private val items = mutableListOf<CameraStore.Cam>()

              fun submit(list: List<CameraStore.Cam>) {
                  items.clear(); items.addAll(list); notifyDataSetChanged()
              }

              override fun onCreateViewHolder(parent: ViewGroup, viewType: Int) =
                  VH(ItemCameraBinding.inflate(LayoutInflater.from(parent.context), parent, false))

              override fun getItemCount() = items.size

              override fun onBindViewHolder(h: VH, pos: Int) {
                  val cam = items[pos]
                  h.b.txtName.text = cam.name
                  h.b.txtUrl.text = cam.rtspUrl()
                  h.b.root.setOnClickListener { onClick(cam) }
                  h.b.root.setOnLongClickListener { onLongClick(cam); true }
              }

              class VH(val b: ItemCameraBinding) : RecyclerView.ViewHolder(b.root)
          }
          RWF_EOF
          cat > app/src/main/java/com/example/camipro/LiveActivity.kt << 'RWF_EOF'
          package com.example.camipro

          import android.net.Uri
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.View
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import com.example.camipro.databinding.ActivityLiveBinding
          import org.videolan.libvlc.LibVLC
          import org.videolan.libvlc.Media
          import org.videolan.libvlc.MediaPlayer
          import java.io.File

          class LiveActivity : AppCompatActivity() {
              private lateinit var b: ActivityLiveBinding
              private lateinit var libVlc: LibVLC
              private lateinit var player: MediaPlayer
              private val handler = Handler(Looper.getMainLooper())
              private var recording = false
              private var recFile: File? = null

              private val url: String get() = intent.getStringExtra("url") ?: ""

              private val blinker = object : Runnable {
                  override fun run() {
                      b.txtRec.visibility = if (b.txtRec.visibility == View.VISIBLE) View.INVISIBLE else View.VISIBLE
                      handler.postDelayed(this, 600)
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  b = ActivityLiveBinding.inflate(layoutInflater)
                  setContentView(b.root)
                  title = intent.getStringExtra("name") ?: "كاميرا"
                  b.txtStatus.text = "كيتصل..."

                  libVlc = LibVLC(this, arrayListOf(
                      "--rtsp-tcp", "--network-caching=300",
                      "--no-drop-late-frames", "--no-skip-frames"
                  ))
                  player = MediaPlayer(libVlc)
                  player.setEventListener { e ->
                      runOnUiThread {
                          when (e.type) {
                              MediaPlayer.Event.Playing ->
                                  b.txtStatus.text = if (recording) "كيسجّل دابا..." else "مباشر"
                              MediaPlayer.Event.EncounteredError ->
                                  b.txtStatus.text = "مشكل فالاتصال — تحقق من الرابط"
                              else -> {}
                          }
                      }
                  }
                  play(withRecord = false)

                  b.btnRecord.setOnClickListener {
                      if (recording) stopRecording() else startRecording()
                  }
              }

              private fun recordingsDir(): File {
                  val dir = File(getExternalFilesDir(null), "recordings")
                  dir.mkdirs()
                  return dir
              }

              private fun play(withRecord: Boolean) {
                  player.stop()
                  val media = Media(libVlc, Uri.parse(url))
                  media.setHWDecoderEnabled(true, false)
                  if (withRecord) {
                      recFile = File(recordingsDir(), "rec_${System.currentTimeMillis()}.mp4")
                      media.addOption(":sout=#standard{access=file,mux=mp4,dst=${recFile!!.absolutePath}}")
                      media.addOption(":sout-keep")
                      media.addOption(":sout-all")
                  }
                  player.media = media
                  player.attachViews(b.vlcLayout, null, false, false)
                  player.play()
                  media.release()
                  recording = withRecord
                  updateRecUI()
              }

              private fun startRecording() {
                  play(withRecord = true)
                  Toast.makeText(this, "بدى التسجيل", Toast.LENGTH_SHORT).show()
              }

              private fun stopRecording() {
                  val f = recFile
                  play(withRecord = false)
                  Toast.makeText(this, "تسجّل الملف: ${f?.name}", Toast.LENGTH_LONG).show()
              }

              private fun updateRecUI() {
                  b.btnRecord.text = if (recording) "وقّف التسجيل" else "تسجيل"
                  if (recording) handler.post(blinker) else {
                      handler.removeCallbacks(blinker)
                      b.txtRec.visibility = View.GONE
                  }
              }

              override fun onDestroy() {
                  handler.removeCallbacks(blinker)
                  player.release()
                  libVlc.release()
                  super.onDestroy()
              }
          }
          RWF_EOF
          cat > app/src/main/java/com/example/camipro/RecordingsActivity.kt << 'RWF_EOF'
          package com.example.camipro

          import android.content.Intent
          import android.os.Bundle
          import android.view.LayoutInflater
          import android.view.View
          import android.view.ViewGroup
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.recyclerview.widget.LinearLayoutManager
          import androidx.recyclerview.widget.RecyclerView
          import com.example.camipro.databinding.ActivityRecordingsBinding
          import com.example.camipro.databinding.ItemRecordingBinding
          import java.io.File
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class RecordingsActivity : AppCompatActivity() {
              private lateinit var b: ActivityRecordingsBinding

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  b = ActivityRecordingsBinding.inflate(layoutInflater)
                  setContentView(b.root)
                  title = "التسجيلات المحلية"
                  b.recycler.layoutManager = LinearLayoutManager(this)
              }

              override fun onResume() { super.onResume(); load() }

              private fun files(): List<File> {
                  val dir = File(getExternalFilesDir(null), "recordings")
                  return dir.listFiles { f -> f.extension == "mp4" && f.length() > 1024 }
                      ?.sortedByDescending { it.lastModified() } ?: emptyList()
              }

              private fun load() {
                  val list = files()
                  b.txtEmpty.visibility = if (list.isEmpty()) View.VISIBLE else View.GONE
                  b.recycler.adapter = RecAdapter(list,
                      onClick = { f ->
                          startActivity(Intent(this, PlayerActivity::class.java)
                              .putExtra("path", f.absolutePath).putExtra("name", f.name))
                      },
                      onLongClick = { f ->
                          AlertDialog.Builder(this)
                              .setTitle("مسح التسجيل؟")
                              .setMessage(f.name)
                              .setPositiveButton("مسح") { _, _ -> f.delete(); load() }
                              .setNegativeButton("لا", null)
                              .show()
                          true
                      })
              }

              class RecAdapter(
                  private val items: List<File>,
                  private val onClick: (File) -> Unit,
                  private val onLongClick: (File) -> Unit
              ) : RecyclerView.Adapter<RecAdapter.VH>() {

                  override fun onCreateViewHolder(p: ViewGroup, vt: Int) =
                      VH(ItemRecordingBinding.inflate(LayoutInflater.from(p.context), p, false))

                  override fun getItemCount() = items.size

                  override fun onBindViewHolder(h: VH, pos: Int) {
                      val f = items[pos]
                      val ts = f.nameWithoutExtension.removePrefix("rec_").toLongOrNull()
                      h.b.txtFile.text = ts?.let {
                          SimpleDateFormat("yyyy-MM-dd HH:mm:ss", Locale.getDefault()).format(Date(it))
                      } ?: f.name
                      h.b.txtSize.text = "%.1f MB".format(f.length() / 1024f / 1024f)
                      h.b.root.setOnClickListener { onClick(f) }
                      h.b.root.setOnLongClickListener { onLongClick(f); true }
                  }

                  class VH(val b: ItemRecordingBinding) : RecyclerView.ViewHolder(b.root)
              }
          }
          RWF_EOF
          cat > app/src/main/java/com/example/camipro/PlayerActivity.kt << 'RWF_EOF'
          package com.example.camipro

          import android.net.Uri
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import androidx.appcompat.app.AppCompatActivity
          import androidx.media3.common.C
          import androidx.media3.common.MediaItem
          import androidx.media3.exoplayer.ExoPlayer
          import com.example.camipro.databinding.ActivityPlayerBinding
          import com.google.android.material.chip.Chip
          import java.io.File

          class PlayerActivity : AppCompatActivity() {
              private lateinit var b: ActivityPlayerBinding
              private var player: ExoPlayer? = null

              // المستويات ديال السرعة — زيد ولا نقص من هنا بسهولة
              private val speeds = floatArrayOf(
                  0.25f, 0.5f, 0.75f, 1f, 1.25f, 1.5f, 2f, 3f,
                  4f, 6f, 8f, 12f, 16f, 24f, 32f, 48f, 64f
              )
              private val fastSeekThreshold = 16f // من هاد السرعة كنستعمل القفز السريع
              private var currentSpeed = 1f
              private val handler = Handler(Looper.getMainLooper())

              private val fastSeekRunnable = object : Runnable {
                  override fun run() {
                      val p = player ?: return
                      val next = p.currentPosition + (currentSpeed * 100).toLong()
                      val dur = p.duration
                      if (dur != C.TIME_UNSET && next >= dur) {
                          p.seekTo(dur)
                          applySpeed(1f)
                          return
                      }
                      p.seekTo(next)
                      handler.postDelayed(this, 100)
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  b = ActivityPlayerBinding.inflate(layoutInflater)
                  setContentView(b.root)
                  val path = intent.getStringExtra("path") ?: return finish()
                  title = "مشغّل التسجيلات"

                  player = ExoPlayer.Builder(this).build().also { p ->
                      b.playerView.player = p
                      p.setMediaItem(MediaItem.fromUri(Uri.fromFile(File(path))))
                      p.prepare()
                      p.playWhenReady = true
                  }
                  buildChips()
                  b.sliderSpeed.addOnChangeListener { _, v, fromUser ->
                      if (fromUser) applySpeed(v)
                  }
                  updateSpeedLabel()
              }

              private fun buildChips() {
                  speeds.forEach { s ->
                      val chip = Chip(this).apply {
                          text = formatSpeed(s)
                          isCheckable = true
                          isChecked = s == 1f
                          tag = s
                          setOnClickListener { applySpeed(s) }
                      }
                      b.chips.addView(chip)
                  }
              }

              private fun applySpeed(s: Float) {
                  currentSpeed = s
                  val p = player ?: return
                  if (s >= fastSeekThreshold) {
                      // القفز السريع: مضمون حتى على الهواتف الضعاف
                      p.playWhenReady = false
                      handler.removeCallbacks(fastSeekRunnable)
                      handler.post(fastSeekRunnable)
                  } else {
                      handler.removeCallbacks(fastSeekRunnable)
                      p.setPlaybackSpeed(s)
                      p.playWhenReady = true
                  }
                  for (i in 0 until b.chips.childCount) {
                      val chip = b.chips.getChildAt(i) as? Chip
                      chip?.isChecked = (chip?.tag as? Float) == s
                  }
                  b.sliderSpeed.value = s.coerceIn(b.sliderSpeed.valueFrom, b.sliderSpeed.valueTo)
                  updateSpeedLabel()
              }

              private fun updateSpeedLabel() {
                  b.txtSpeed.text = "السرعة: ${formatSpeed(currentSpeed)}" +
                      if (currentSpeed >= fastSeekThreshold) " (قفز سريع)" else ""
              }

              private fun formatSpeed(s: Float) =
                  if (s == s.toLong().toFloat()) "${s.toLong()}x" else "${s}x"

              override fun onDestroy() {
                  handler.removeCallbacks(fastSeekRunnable)
                  player?.release()
                  super.onDestroy()
              }
          }
          RWF_EOF
